playback:
  # spotify: control everything through the Spotify Web API (any OS).
  # local:   Spotify launches media; MPRIS + PulseAudio control it (Linux).
  control: local
  # local only: launch playlists on this Spotify Connect device (e.g. a spotifyd receiver).
  connect-device: deskpad
  # local only: only control MPRIS players whose D-Bus name starts with this.
  mpris-prefix: org.mpris.MediaPlayer2.spotifyd
use-streamdeck: true
web:
  addr: :1337
  auth-token: change-me
timebox:
  addr: AA:BB:CC:DD:EE:FF
  color:
    red: 33
    green: 255
    blue: 66
weather:
  addr: 127.0.0.1:10101
  latitude: 45.4240115
  longitude: -75.7019322
bluetooth:
  adapter-id: hci0
media-playlists:
  - id: playlist:uri:123
    name: Example playlist 1
  - id: playlist:uri:456
    name: Example playlist 2
house:
  addr: yourhost.example.com:1337
  use-tls: true
  ca-cert: /etc/house/tls/ca.crt
  cert-file: /etc/house/tls/tls.crt
  key-file: /etc/house/tls/tls.key
  # Required whenever addr isn't itself the name the server's certificate
  # was issued for - e.g. house's step-ca-issued bridge certs are for
  # "<name>.<host>.house.internal", not the address actually dialed.
  server-name: housed.yourhost.house.internal
  rooms:
    - room-id: 11111111-1111-1111-1111-111111111111
      label: Living Room
bridge:
  addr: :7700
  device-id: desk-1
  device-name: Rob's Desk
